name: Build extension

on:
  push:
    branches: [master]
    tags: ["v[0-9]*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: node --test tests/*.test.cjs

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import json, os; version=json.load(open('manifest.json', encoding='utf-8'))['version']; expected='v'+version; actual=os.environ['GITHUB_REF_NAME']; assert actual == expected, f'tag {actual} must equal {expected}'"

      - name: Build Chrome Web Store package
        run: python scripts/build_extension.py

      - name: Verify reproducible package
        run: |
          python scripts/build_extension.py --output-dir dist-repro
          cmp dist/*.zip dist-repro/*.zip
          sha256sum dist/*.zip

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
