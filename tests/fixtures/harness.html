<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>扇贝助手内容脚本测试</title>
    <link rel="stylesheet" href="../../src/css/words.css">
    <style>
      body {
        max-width: 920px;
        margin: 32px auto;
        padding: 0 20px;
        background: #f5f7f6;
        font-family: sans-serif;
      }

      .fixture-controls {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      .StudyPage_studyPage__fixture {
        padding: 24px;
        border-radius: 12px;
        background: white;
      }

      .VocabPronounce_word__fixture {
        margin-bottom: 16px;
        font-size: 28px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="fixture-controls">
      <button id="change-word" type="button">切换到 sample</button>
      <button id="missing-word" type="button">切换到无结果词</button>
    </div>
    <main class="StudyPage_studyPage__fixture">
      <div class="VocabPronounce_word__fixture">example</div>
      <div class="BayTrans_container__fixture">
        <div class="BayTrans_paraphrase__fixture">扇贝原释义</div>
      </div>
    </main>
    <script src="mock-runtime.js"></script>
    <script src="../../third-party/hyphen-en-us.js"></script>
    <script src="../../third-party/hyphen.js"></script>
    <script src="../../src/js/words.js"></script>
  </body>
</html>
